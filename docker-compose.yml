
services:
  # MySQL база данных
  mysql:
    image: mysql:8.0
    container_name: coach_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: database_coach
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Backend (FastAPI)
  backend:
    build: ./backend
    container_name: coach_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@mysql:3306/database_coach
      - SECRET_KEY=your-super-secret-key-change-in-prod
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  # Frontend (React + Vite)
  frontend:
    build: ./frontend
    container_name: coach_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge