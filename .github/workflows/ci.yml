name: CI Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
      
      - name: Run Backend Tests
        run: |
          cd backend
          export DATABASE_URL=mysql+pymysql://root:root@mysql:3306/database_coach
          export DOMAIN=http://localhost:5173
          export DATABASE_TEST_URL="sqlite:///:memory:"
          export SECRET_KEY="test-secret-key-for-ci"
          export WEATHER_API_KEY="${{ secrets.WEATHER_API_KEY }}"
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run Unit & Integration Tests
        run: |
          cd frontend
          npm run test -- --run
      
      - name: Setup Backend for E2E
        run: |
          cd backend
          pip install -r requirements.txt
          export DATABASE_URL="mysql+pymysql://root:root@localhost:3306/test_db"
          export SECRET_KEY="test-secret"
          export DOMAIN="http://localhost:5173"
          export WEATHER_API_KEY="${{ secrets.WEATHER_API_KEY }}"
          # Запусти бэкенд в фоне
          uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          # Подожди пока поднимется
          sleep 10
        env:
          DATABASE_URL: mysql+pymysql://root:root@localhost:3306/test_db
          SECRET_KEY: test-secret
          DOMAIN: http://localhost:5173
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      
      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/docs > /dev/null 2>&1; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      
      - name: Run E2E Tests
        run: |
          cd frontend
          npx playwright test e2e/
        env:
          CI: true
          BASE_URL: http://localhost:8000  # или http://localhost:8000 если тесты к API
      
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30